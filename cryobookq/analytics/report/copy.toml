# Locked Comparison Scorecard copy (prose). Edit here — not in HTML snippets.

[meta]
eyebrow = "CryoBookQ · Independent book-quality comparer"
footer = """Generated {generated} by CryoBookQ.
Independent research tooling — not an exchange publication.
Figures are point-in-time L5 books; they are not a prediction of fill quality under stress."""

[sections.overall]
heading = "Overall index (0–10)"
explain = """Comparable multi-venue score. Higher is better. Built only from <strong>matched</strong>
options (same underlying, expiry, strike, call/put on both venues). Absolute score
bands are fixed so adding a third venue does not reshuffle peer ranks."""

[sections.components]
heading = "Component summary"
explain = """The overall index is a weighted blend of three components:
<strong>grid</strong> ({grid_pct} — tradable ATM-to-wing landmarks),
<strong>wings</strong> ({wings_pct} — very far OTM / 2.5Δ),
and <strong>presence</strong> ({presence_pct} — share of matched
books that are two-sided)."""

[sections.executive]
heading = "Executive Summary"

[sections.presence]
heading = "Presence"
explain = """Among matched contracts with |Δ| ≥ 0.05, what fraction of books have both a bid and
an ask? Listing many one-sided names lowers this score. Missing quotes also zero-out
spread and $10k-lift scores in the landmark grid for that venue."""

[sections.grid]
heading = "Liquidity grid (3×3)"
explain = """Each cell picks the nearest listed expiry to the tenor targets, then the nearest
<strong>call and put</strong> to the |Δ| target, and averages them.
Columns per venue:
<strong>Spread</strong> = (ask₁ − bid₁) / mid as %;
<strong>$10k</strong> = effective premium paid above mid when lifting ~$10 000 of option
premium through L5 (n/a if the book cannot fill);
<strong>Depth</strong> = sum of L5 bid+ask premium notional ($000s);
<strong>Score</strong> = 0–10 blend weighted <strong>65% spread / 25% $10k lift / 10% depth</strong>
(green highlight = best score in the row)."""
delta_note = """Delta targets: 50Δ (near ATM), 25Δ, and 7.5Δ. Very far OTM (2.5Δ) is scored separately
under Wings so junk listings do not dominate the grid."""

[sections.wings]
heading = "Wings (2.5Δ)"
explain = """Same tenor recipe as the grid, but targeting |Δ| ≈ 0.025. This is a separate component:
wide or empty wing books are common and should not drown the ATM/25Δ comparison."""

[sections.methodology]
heading = "Methodology notes"

[[sections.methodology.items]]
term = "Universe"
definition = "BTC options only. Exact match on (expiry, strike, call/put). Unmatched listings are excluded from landmark cells."

[[sections.methodology.items]]
term = "$10k lift"
definition = "Walk the ask until ~$10 000 of option premium is filled (not spot BTC). Score uses (VWAP − mid) / mid."

[[sections.methodology.items]]
term = "0–10 maps"
definition = "Absolute reference bands per delta bucket (documented in CryoBookQ SCORING.md). Missing/one-sided → 0 for that component. Each cell blends 65% relative spread, 25% $10k lift, 10% L5 depth."

[[sections.methodology.items]]
term = "Period scores"
definition = "When multiple snapshots are included, each snapshot gets a full scorecard; reported figures are equal-weight averages across snapshots."

[[sections.methodology.items]]
term = "Deltas"
definition = "Canonical |Δ| from Deribit mark IV / forward (Black–Scholes), attached to both venues’ matched contracts for landmark selection."
