[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryobookq"
version = "0.0.1"
description = "Deribit vs Coincall option orderbook quality comparer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "websockets>=12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
hub = [
    "flask>=3",
]

[tool.setuptools.packages.find]
include = ["cryobookq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real exchange APIs / WebSockets (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
