[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryobookq"
version = "0.1.1"
description = "Multi-exchange BTC option orderbook quality comparer (Deribit hub vs Coincall, Bybit, OKX, Binance)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aureas GmbH" }]
keywords = ["options", "orderbook", "deribit", "market-data", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "websockets>=12",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Rick987-beep/CryoBookQ"
Documentation = "https://github.com/Rick987-beep/CryoBookQ/blob/main/docs/README.md"
Repository = "https://github.com/Rick987-beep/CryoBookQ"
Issues = "https://github.com/Rick987-beep/CryoBookQ/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
hub = [
    "flask>=3",
]

[project.scripts]
cryobookq-daemon = "cryobookq.daemon.__main__:main"
cryobookq-hub = "cryobookq.hub.app:main"

[tool.setuptools.packages.find]
include = ["cryobookq*"]

[tool.setuptools.package-data]
cryobookq = [
    "analytics/report/copy.toml",
    "analytics/report/templates/*.html",
    "analytics/report/templates/*.css",
    "analytics/report/templates/snippets/*.html",
    "hub/copy.toml",
    "hub/templates/*.html",
    "hub/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real exchange APIs / WebSockets (deselected by default)",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]  # sys.path bootstrap before package imports
